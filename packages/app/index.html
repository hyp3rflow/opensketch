<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSketch</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <div id="toolbar"></div>
    <div id="workspace">
      <div id="layers-panel"></div>
      <div id="ds-modal-backdrop" class="ds-modal-backdrop">
        <div id="ds-modal" class="ds-modal">
          <div class="ds-modal-header">
            <span class="ds-modal-title">Design System</span>
            <button id="ds-modal-close" class="ds-modal-close">✕</button>
          </div>
          <div id="design-system-panel" class="ds-modal-body"></div>
        </div>
      </div>
      <canvas id="canvas"></canvas>
      <div id="right-pane">
        <div id="right-pane-tabs">
          <button class="right-pane-tab active" data-tab="properties">Properties</button>
          <button class="right-pane-tab" data-tab="agent">Agent</button>
          <button class="right-pane-tab" data-tab="history">History</button>
          <button class="right-pane-tab" data-tab="handoff">Handoff</button>
          <button class="right-pane-tab" data-tab="comments">Comments</button>
          <button class="right-pane-tab" data-tab="variables">Variables</button>
          <button class="right-pane-tab" data-tab="assets">Assets</button>
          <button class="right-pane-tab" data-tab="bookmarks">Bookmarks</button>
          <button class="right-pane-tab" data-tab="bookmarks">Bookmarks</button>
          <button class="right-pane-tab" data-tab="accessibility">A11y</button>
          <button class="right-pane-tab" data-tab="plugins">Plugins</button>
          <button class="right-pane-tab" data-tab="palette">Palette</button>
          <button class="right-pane-tab" data-tab="docs">Docs</button>
          <button class="right-pane-tab" data-tab="libraries">Libraries</button>
          <button class="right-pane-tab" data-tab="permissions">Perms</button>
          <button class="right-pane-tab" data-tab="quiz">Quiz</button>
          <button class="right-pane-tab" data-tab="migration">Migration</button>
          <button class="right-pane-tab" data-tab="icons">Icons</button>
          <button class="right-pane-tab" data-tab="templates">Templates</button>
          <button class="right-pane-tab" data-tab="artboards">Artboards</button>
          <button class="right-pane-tab" data-tab="dependencies">Deps</button>
        </div>
        <div id="properties-panel" class="right-pane-content active"></div>
        <div id="agent-panel" class="right-pane-content"></div>
        <div id="history-panel" class="right-pane-content"></div>
        <div id="handoff-panel" class="right-pane-content"></div>
        <div id="comments-panel" class="right-pane-content"></div>
        <div id="variables-panel" class="right-pane-content"></div>
        <div id="assets-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="bookmarks-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="bookmarks-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="accessibility-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="plugins-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="palette-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="docs-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="libraries-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="permissions-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="quiz-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="migration-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="icons-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="templates-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="artboards-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
        <div id="dependencies-panel" class="right-pane-content" style="display:flex;flex-direction:column;"></div>
      </div>
      <div id="bottom-toolbar"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
